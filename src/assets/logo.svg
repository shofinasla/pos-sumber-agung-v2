<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Path for Top Text: SUMBER AGUNG -->
    <!-- Arc from ~140deg to ~40deg across top -->
    <path id="top-arc" d="M 68,250 A 182,182 0 1,1 432,250" fill="none" />
    
    <!-- Path for Bottom Text: TOKO BANGUNAN -->
    <!-- Arc across bottom -->
    <path id="bottom-arc" d="M 72,250 A 178,178 0 0,0 428,250" fill="none" />

    <style>
      .logo-text-top {
        font-family: 'Arial Black', 'Impact', 'Montserrat', 'Inter', system-ui, sans-serif;
        font-size: 35px;
        font-weight: 900;
        fill: #FFFFFF;
        letter-spacing: 5px;
      }
      .logo-text-bottom {
        font-family: 'Arial Black', 'Impact', 'Montserrat', 'Inter', system-ui, sans-serif;
        font-size: 34px;
        font-weight: 900;
        fill: #FFFFFF;
        letter-spacing: 5px;
      }
    </style>
  </defs>

  <!-- Outer Black Border & Red Circular Ring -->
  <circle cx="250" cy="250" r="238" fill="#D82323" stroke="#111111" stroke-width="8" />

  <!-- Inner White Circle with Black Border -->
  <circle cx="250" cy="250" r="162" fill="#FFFFFF" stroke="#111111" stroke-width="7" />

  <!-- Top Text: SUMBER AGUNG -->
  <text class="logo-text-top">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      SUMBER AGUNG
    </textPath>
  </text>

  <!-- Bottom Text: TOKO BANGUNAN -->
  <text class="logo-text-bottom">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      TOKO BANGUNAN
    </textPath>
  </text>

  <!-- Left Star (White 5-point star) -->
  <!-- Center ~ (46, 250) -->
  <polygon points="48,236 52,246 62,247 54,254 57,264 48,258 39,264 42,254 34,247 44,246" fill="#FFFFFF" />

  <!-- Right Star (White 5-point star) -->
  <!-- Center ~ (452, 250) -->
  <polygon points="452,236 456,246 466,247 458,254 461,264 452,258 443,264 446,254 438,247 448,246" fill="#FFFFFF" />

  <!-- CENTER EMBLEM: CANDI / PAGODA TEMPLE & LETTERS 'S' & 'A' -->
  <g id="center-graphic" transform="translate(0, 5)">
    <!-- Top finial / spire crown -->
    <path d="M 250,92 C 248,84 243,80 250,74 C 257,80 252,84 250,92 Z" fill="#111111" />
    <path d="M 241,94 C 246,90 254,90 259,94 C 255,98 245,98 241,94 Z" fill="#111111" />

    <!-- Tiered Roof Slabs (7 tiers with pagoda curved upturned edges) -->
    <!-- Tier 1 -->
    <path d="M 235,108 L 265,108 L 262,114 L 238,114 Z" fill="#111111" />
    <!-- Tier 2 -->
    <path d="M 226,120 L 274,120 L 270,126 L 230,126 Z" fill="#111111" />
    <!-- Tier 3 -->
    <path d="M 216,132 L 284,132 L 279,139 L 221,139 Z" fill="#111111" />
    <!-- Tier 4 -->
    <path d="M 204,145 L 296,145 L 290,152 L 210,152 Z" fill="#111111" />
    <!-- Tier 5 -->
    <path d="M 191,158 L 309,158 L 302,166 L 198,166 Z" fill="#111111" />
    <!-- Tier 6 -->
    <path d="M 176,172 L 324,172 L 316,180 L 184,180 Z" fill="#111111" />
    <!-- Tier 7 (Bottom main roof beam with upward sweeping horned ends) -->
    <path d="M 148,198 C 160,202 175,195 190,195 L 310,195 C 325,195 340,202 352,198 C 344,192 334,187 320,187 L 180,187 C 166,187 156,192 148,198 Z" fill="#111111" />

    <!-- Gate / Doorway Pillars -->
    <!-- Left Pillar (Double border outline) -->
    <rect x="210" y="202" width="16" height="74" fill="none" stroke="#111111" stroke-width="4.5" />
    <!-- Right Pillar (Double border outline) -->
    <rect x="274" y="202" width="16" height="74" fill="none" stroke="#111111" stroke-width="4.5" />
    <!-- Gate Lintel beam -->
    <rect x="200" y="200" width="100" height="7" fill="#111111" />

    <!-- Horizontal Steps under gate (5 steps) -->
    <rect x="220" y="278" width="60" height="6.5" fill="#111111" />
    <rect x="212" y="289" width="76" height="6.5" fill="#111111" />
    <rect x="204" y="300" width="92" height="6.5" fill="#111111" />
    <rect x="196" y="311" width="108" height="6.5" fill="#111111" />
    <rect x="186" y="322" width="128" height="7.5" fill="#111111" />

    <!-- LEFT LETTER 'S' WITH TOP FLOURISH -->
    <!-- Flourish wave above 'S' -->
    <path d="M 120,214 C 130,206 142,220 156,212 C 168,205 178,214 186,210 C 180,216 166,211 154,218 C 140,226 128,210 120,214 Z" fill="#111111" />
    
    <!-- Stylized Double-Line / Hollow Bold 'S' -->
    <g transform="translate(115, 224)">
      <!-- Outer/Inner path for stylized 'S' -->
      <path d="M 52,10 C 35,6 18,16 14,32 C 10,48 24,59 40,65 C 56,71 63,78 61,90 C 58,103 44,111 28,108 C 16,106 6,97 2,86 L 14,83 C 16,91 23,98 32,99 C 41,100 50,94 51,85 C 53,74 44,67 29,61 C 14,55 0,44 4,26 C 8,8 28,-3 48,1 Z" fill="#111111" />
      <path d="M 46,15 C 34,12 22,20 19,31 C 16,42 26,50 38,55 C 52,60 56,66 54,75 C 52,83 45,88 34,87 C 26,86 21,80 19,73 L 26,71 C 27,75 31,78 35,78 C 40,78 44,75 45,70 C 46,63 40,58 29,53 C 18,48 7,40 10,26 C 13,13 28,5 44,8 Z" fill="#FFFFFF" />
    </g>

    <!-- RIGHT LETTER 'A' WITH TOP FLOURISH -->
    <!-- Flourish wave above 'A' -->
    <path d="M 314,210 C 322,214 332,205 344,212 C 358,220 370,206 380,214 C 372,210 360,226 346,218 C 334,211 320,216 314,210 Z" fill="#111111" />

    <!-- Stylized Double-Line / Hollow Bold 'A' -->
    <g transform="translate(305, 222)">
      <!-- Main outer frame of 'A' -->
      <path d="M 45,0 L 78,110 L 63,110 L 53,75 L 29,75 L 20,110 L 4,110 L 37,0 Z 
               M 41,24 L 28,63 L 54,63 Z" fill="#111111" />
      <!-- Inner cutout to give hollow outline effect -->
      <path d="M 43,10 L 70,102 L 64,102 L 54,69 L 28,69 L 19,102 L 12,102 L 39,10 Z 
               M 41,30 L 31,60 L 51,60 Z" fill="#FFFFFF" />
      <path d="M 41,32 L 33,58 L 49,58 Z" fill="#111111" />
    </g>
  </g>
</svg>
